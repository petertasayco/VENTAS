<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ranking de Asesores</title>

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/ranking.css">

</head>

<body>

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header class="header">

        <div class="logo">

            <img src="img/logo.png" alt="Logo">

            <div>

                <h1>Ranking de Asesores</h1>

                <span id="ultimaActualizacion">
                    Última actualización: --
                </span>

            </div>

        </div>

        <nav>

            <a href="index.html">Dashboard</a>

        </nav>

    </header>

    <!-- ========================= -->
    <!-- FILTROS -->
    <!-- ========================= -->

    <section class="contenedor-filtros">

        <div class="filtro">

            <label>Desde</label>

            <input type="date" id="fechaInicio">

        </div>

        <div class="filtro">

            <label>Hasta</label>

            <input type="date" id="fechaFin">

        </div>

        <div class="filtro">

            <label>Supervisor</label>

            <select id="supervisor">

                <option value="">Todos</option>

            </select>

        </div>


        <div class="filtro buscador">

            <label>Buscar asesor</label>

            <input
                type="text"
                id="buscarAsesor"
                placeholder="Nombre del asesor">

        </div>

        <button id="btnFiltrar">

            Filtrar

        </button>

    </section>

    <!-- ========================= -->
    <!-- RESUMEN -->
    <!-- ========================= -->

    <section class="contenedor-resumen">

        <div class="card-kpi">

            <h3>Total Asesores</h3>

            <p id="totalAsesores">0</p>

        </div>

        <div class="card-kpi">

            <h3>Ventas</h3>

            <p id="totalVentas">0</p>

        </div>

        <div class="card-kpi">

            <h3>UP Móvil</h3>

            <p id="totalMovil">S/ 0</p>

        </div>

        <div class="card-kpi">

            <h3>Migraciones</h3>

            <p id="totalMigraciones">0</p>

        </div>

        <div class="card-kpi">

            <h3>UP Hogar</h3>

            <p id="totalHogar">S/ 0</p>

        </div>

    </section>

    <!-- ========================= -->
    <!-- TABLA -->
    <!-- ========================= -->

    <section class="contenedor-ranking">

        <table class="tabla-ranking">

            <thead>

                <tr>

                    <th>#</th>

                    <th>Asesor</th>

                    <th>Supervisor</th>

                    <th>UP Móvil</th>

                    <th>Migraciones</th>

                    <th>UP Hogar</th>

                    <th>Total</th>

                    <th></th>

                </tr>

            </thead>

            <tbody id="tablaRanking">

            </tbody>

        </table>

    </section>

    <!-- ========================= -->
    <!-- PAGINACIÓN -->
    <!-- ========================= -->

    <section class="paginacion">

        <button id="btnAnterior">

            ◀ Anterior

        </button>

        <span id="paginaActual">

            Página 1

        </span>

        <button id="btnSiguiente">

            Siguiente ▶

        </button>

    </section>

    <!-- ========================= -->
    <!-- SPINNER -->
    <!-- ========================= -->

    <div id="spinner" class="spinner oculto">

        <div class="loader"></div>

        <p>Cargando ranking...</p>

    </div>

    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/utilidades.js"></script>
    <script src="js/filtros.js"></script>
    <script src="js/ranking.js"></script>

</body>

</html>
