<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle del Asesor</title>

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/asesor.css">

</head>

<body>

    <!-- ===================================== -->
    <!-- HEADER -->
    <!-- ===================================== -->

    <header class="header">

        <div class="logo">

            <img src="img/logo.png" alt="Logo">

            <div>

                <h1 id="nombreAsesor">
                    Cargando...
                </h1>

                <span id="nombreSupervisor">
                    Supervisor: --
                </span>

            </div>

        </div>

        <nav>

            <a href="index.html">Dashboard</a>

            <a href="ranking.html">Ranking</a>

        </nav>

    </header>

    <!-- ===================================== -->
    <!-- INFORMACIÓN GENERAL -->
    <!-- ===================================== -->

    <section class="contenedor-info">

        <div class="info">

            <label>Supervisor</label>

            <p id="supervisor">-</p>

        </div>

        <div class="info">

            <label>Estado</label>

            <p id="estado">Activo</p>

        </div>

    </section>

    <!-- ===================================== -->
    <!-- KPIs -->
    <!-- ===================================== -->

    <section class="contenedor-kpis">

        <div class="card-kpi">

            <h3>UP Móvil</h3>

            <p id="kpiMovil">S/ 0</p>

        </div>

        <div class="card-kpi">

            <h3>Migraciones</h3>

            <p id="kpiMigraciones">0</p>

        </div>

        <div class="card-kpi">

            <h3>UP Hogar</h3>

            <p id="kpiHogar">S/ 0</p>

        </div>

        <div class="card-kpi">

            <h3>Total Ventas</h3>

            <p id="kpiVentas">0</p>

        </div>

        <div class="card-kpi">

            <h3>Comisión Total</h3>

            <p id="kpiComision">S/ 0</p>

        </div>

    </section>

    <!-- ===================================== -->
    <!-- GRÁFICOS -->
    <!-- ===================================== -->

    <section class="contenedor-graficos">

        <div class="grafico">

            <h2>Ventas por Tipo</h2>

            <canvas id="graficoTipos"></canvas>

        </div>

        <div class="grafico">

            <h2>Evolución Diaria</h2>

            <canvas id="graficoEvolucion"></canvas>

        </div>

    </section>

    <!-- ===================================== -->
    <!-- FILTROS -->
    <!-- ===================================== -->

    <section class="contenedor-filtros">

        <div class="filtro">

            <label>Desde</label>

            <input type="date" id="fechaInicio">

        </div>

        <div class="filtro">

            <label>Hasta</label>

            <input type="date" id="fechaFin">

        </div>

        <div class="filtro">

            <label>Tipo de Venta</label>

            <select id="tipoVenta">

                <option value="">Todas</option>

                <option value="Up grade movil">UP Móvil</option>

                <option value="Migraciones">Migración</option>

                <option value="Up grade hogar">UP Hogar</option>

            </select>

        </div>

        <div class="filtro">

            <label>Estado Crédito</label>

            <select id="estadoCredito">

                <option value="">Todos</option>

                <option value="APROBADO">
                    Aprobado
                </option>

                <option value="NEGADO">
                    Negado
                </option>

                <option value="PENDIENTE BIOMETRIA">
                    Pendiente Biometria
                </option>

            </select>

        </div>

        <button id="btnFiltrar">

            Filtrar

        </button>

    </section>

    <!-- ===================================== -->
    <!-- TABLA -->
    <!-- ===================================== -->

    <section class="contenedor-tabla">

        <table>

            <thead>

                <tr>

                    <th>Fecha</th>

                    <th>Cliente</th>

                    <th>Tipo</th>

                    <th>Plan Anterior</th>

                    <th>Plan Nuevo</th>

                    <th>Diferencia</th>

                    <th>Estado</th>

                </tr>

            </thead>

            <tbody id="tablaVentas">

            </tbody>

        </table>

    </section>

    <!-- ===================================== -->
    <!-- BOTONES -->
    <!-- ===================================== -->

    <section class="acciones">

        <button id="btnExcel">

            Exportar Excel

        </button>

        <button id="btnPDF">

            Exportar PDF

        </button>

    </section>

    <!-- ===================================== -->
    <!-- SPINNER -->
    <!-- ===================================== -->

    <div id="spinner" class="spinner oculto">

        <div class="loader"></div>

        <p>Cargando asesor...</p>

    </div>

    <!-- ===================================== -->
    <!-- SCRIPTS -->
    <!-- ===================================== -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/utilidades.js"></script>
    <script src="js/filtros.js"></script>
    <script src="js/asesor.js"></script>

</body>

</html>
